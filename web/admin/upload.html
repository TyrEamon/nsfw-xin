<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Upload</title>
  <link rel="icon" href="https://pan.0106010.xyz/file/Logo/Blog/1769235233816_IMG_20260124_141233.jpg">
  <style>
    :root {
      --bg: #f6f7fb;
      --text: #1a1b1f;
      --muted: #6b7280;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --accent: #2563eb;
    }
    [data-theme="dark"] {
      --bg: #0f1116;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --glass-bg: rgba(20, 22, 28, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --card-bg: #151821;
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      --accent: #93c5fd;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Noto Serif SC", serif;
      margin: 0;
      background: radial-gradient(1200px 600px at 15% 0%, rgba(37,99,235,0.08), transparent 60%),
                  radial-gradient(1000px 500px at 85% 10%, rgba(59,130,246,0.08), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: var(--card-shadow);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 20px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field input[type="file"] {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }

    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .result {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="https://pan.0106010.xyz/file/Logo/Blog/1769235233816_IMG_20260124_141233.jpg" alt="logo">
        <div class="title">Admin Upload</div>
      </div>
      <a href="/gallery" style="text-decoration:none;color:var(--text);">Gallery</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="hint">上传图片后会自动：发送到 TG 频道（预览 + 原图），并写入 D1。标题固定为 upload。</div>
      <form id="upload-form" enctype="multipart/form-data">
        <div class="field">
          <label>选择图片（支持多选）</label>
          <input type="file" name="files" accept="image/*" multiple required>
        </div>
        <button class="btn" type="submit">上传</button>
      </form>
      <div class="result" id="result"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('upload-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      result.textContent = '正在上传...';
      try {
        const res = await fetch('/admin/upload', {
          method: 'POST',
          body: fd,
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) {
          result.textContent = data.error || '上传失败';
          return;
        }
        result.textContent = `完成：成功 ${data.success}，失败 ${data.failed}`;
      } catch (err) {
        result.textContent = '上传失败';
      }
    });
  </script>
</body>
</html>
