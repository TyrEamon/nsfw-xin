<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员后台</title>
  <link rel="icon" href="https://pan.0106010.xyz/file/Bimg/1770618967630_file_470.png">
  <style>
    :root {
      --bg: #f6f7fb;
      --text: #1a1b1f;
      --muted: #6b7280;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --card-bg: #ffffff;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --accent: #2563eb;
    }
    [data-theme="dark"] {
      --bg: #0f1116;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --glass-bg: rgba(20, 22, 28, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --card-bg: #151821;
      --card-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      --accent: #93c5fd;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Noto Serif SC", serif;
      margin: 0;
      background: radial-gradient(1200px 600px at 15% 0%, rgba(37,99,235,0.08), transparent 60%),
                  radial-gradient(1000px 500px at 85% 10%, rgba(59,130,246,0.08), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: var(--card-shadow);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 20px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field input[type="file"] {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
    }

    .hint {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .result {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .manage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .manage-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .manage-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .manage-actions select {
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--text);
      padding: 8px 10px;
    }
    .manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 10px;
    }
    .thumb-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0,0,0,0.05);
      aspect-ratio: 1 / 1;
      border: 1px solid var(--glass-border);
    }
    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-overlay {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.55));
    }
    .thumb-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(0,0,0,0.45);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .thumb-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .thumb-btn.favorite-on {
      color: #ff7070;
      border-color: rgba(255, 112, 112, 0.8);
    }
    .load-more-wrap {
      margin-top: 12px;
      text-align: center;
    }
    .muted {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .tips-card {
      margin-top: 16px;
      font-size: 0.9rem;
    }
    .tips-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .tips-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }
    .tips-list li {
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .tips-list a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="https://pan.0106010.xyz/file/Bimg/1770618967630_file_470.png" alt="logo">
        <div class="title">Admin Upload</div>
      </div>
      <a href="https://tyr.mtcacg.top/gallery.html" style="text-decoration:none;color:var(--text);">Gallery</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="hint">上传图片后会自动：发送到 TG 频道（预览 + 原图），并写入 D1。标题固定为 upload。</div>
      <form id="upload-form" enctype="multipart/form-data">
        <div class="field">
          <label>选择图片（支持多选）</label>
          <input type="file" name="files" accept="image/*" multiple required>
        </div>
        <button class="btn" type="submit">上传</button>
      </form>
      <div class="result" id="result"></div>
    </div>

    <div class="card tips-card">
      <div class="tips-title">随机图 API 小Tips</div>
      <ul class="tips-list">
        <li><a href="https://pic.mtcacg.top/api/random" target="_blank" rel="noopener">https://pic.mtcacg.top/api/random</a>（随机一张）</li>
        <li><a href="https://pic.mtcacg.top/api/random?type=h" target="_blank" rel="noopener">https://pic.mtcacg.top/api/random?type=h</a>（随机横图）</li>
        <li><a href="https://pic.mtcacg.top/api/random?type=v" target="_blank" rel="noopener">https://pic.mtcacg.top/api/random?type=v</a>（随机竖图）</li>
      </ul>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="manage-header">
        <div>
          <div class="manage-title">图片管理</div>
          <div class="muted">缩略图预览，支持收藏和隐藏（隐藏会加入黑名单，防止爬虫回灌）。</div>
        </div>
        <div class="manage-actions">
          <select id="status-filter">
            <option value="active">仅活动</option>
            <option value="hidden">仅隐藏</option>
            <option value="all">全部</option>
          </select>
          <button class="btn" type="button" id="refresh-btn">刷新</button>
        </div>
      </div>
      <div class="manage-grid" id="thumb-grid"></div>
      <div class="load-more-wrap">
        <button class="btn" type="button" id="load-more-btn">加载更多</button>
      </div>
      <div class="result" id="manage-result"></div>
    </div>
  </main>

  <script>
    const form = document.getElementById('upload-form');
    const result = document.getElementById('result');
    const grid = document.getElementById('thumb-grid');
    const manageResult = document.getElementById('manage-result');
    const statusFilter = document.getElementById('status-filter');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const refreshBtn = document.getElementById('refresh-btn');
    const PAGE_SIZE = 72;
    let offset = 0;
    let done = false;
    let loading = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      result.textContent = '正在上传...';
      try {
        const res = await fetch('/admin/upload', {
          method: 'POST',
          body: fd,
          credentials: 'include'
        });
        const data = await res.json();
        if (!res.ok) {
          result.textContent = data.error || '上传失败';
          return;
        }
        result.textContent = `完成：成功 ${data.success}，失败 ${data.failed}`;
      } catch (err) {
        result.textContent = '上传失败';
      }
    });

    function svgHeart() {
      return '<svg viewBox="0 0 24 24"><path d="M20.2 5.8a4.9 4.9 0 0 0-6.9 0L12 7.1l-1.3-1.3a4.9 4.9 0 0 0-6.9 6.9L12 21l8.2-8.3a4.9 4.9 0 0 0 0-6.9z"/></svg>';
    }

    function svgTrash() {
      return '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>';
    }

    function favoriteOn(value) {
      return value === true || value === 1 || value === '1';
    }

    async function postJSON(url, payload) {
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || 'request failed');
      }
      return data;
    }

    function buildCard(item) {
      const card = document.createElement('div');
      card.className = 'thumb-card';
      card.dataset.id = item.id || '';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = item.preview_id ? ('/image/' + item.preview_id) : '';
      img.alt = item.title || item.id || 'image';
      card.appendChild(img);

      const overlay = document.createElement('div');
      overlay.className = 'thumb-overlay';

      const favBtn = document.createElement('button');
      favBtn.type = 'button';
      favBtn.className = 'thumb-btn';
      if (favoriteOn(item.is_favorite)) {
        favBtn.classList.add('favorite-on');
      }
      favBtn.title = '喜欢';
      favBtn.innerHTML = svgHeart();
      favBtn.addEventListener('click', async () => {
        const on = !favBtn.classList.contains('favorite-on');
        try {
          await postJSON('/admin/api/images/favorite', { id: item.id, on });
          favBtn.classList.toggle('favorite-on', on);
          manageResult.textContent = on ? '已加入喜欢' : '已取消喜欢';
        } catch (err) {
          manageResult.textContent = err.message || '操作失败';
        }
      });
      overlay.appendChild(favBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'thumb-btn';
      delBtn.title = '隐藏';
      delBtn.innerHTML = svgTrash();
      delBtn.addEventListener('click', async () => {
        if (!window.confirm('确认隐藏这张图并加入黑名单？')) {
          return;
        }
        try {
          await postJSON('/admin/api/images/hide', { id: item.id, reason: 'admin_hide' });
          card.remove();
          manageResult.textContent = '已隐藏并加入黑名单';
        } catch (err) {
          manageResult.textContent = err.message || '删除失败';
        }
      });
      overlay.appendChild(delBtn);

      card.appendChild(overlay);
      return card;
    }

    async function loadImages(reset) {
      if (loading || done) return;
      loading = true;
      manageResult.textContent = '加载中...';
      try {
        const status = statusFilter.value;
        const res = await fetch(`/admin/api/images?offset=${offset}&limit=${PAGE_SIZE}&status=${encodeURIComponent(status)}`, {
          credentials: 'include'
        });
        const items = await res.json();
        if (!res.ok) {
          manageResult.textContent = items.error || '加载失败';
          loading = false;
          return;
        }
        if (!Array.isArray(items) || items.length === 0) {
          done = true;
          manageResult.textContent = reset ? '暂无数据' : '没有更多了';
          loading = false;
          return;
        }
        const frag = document.createDocumentFragment();
        items.forEach((item) => frag.appendChild(buildCard(item)));
        grid.appendChild(frag);
        offset += items.length;
        manageResult.textContent = `已加载 ${offset} 张`;
      } catch (err) {
        manageResult.textContent = '加载失败';
      } finally {
        loading = false;
      }
    }

    function resetAndReload() {
      offset = 0;
      done = false;
      grid.innerHTML = '';
      loadImages(true);
    }

    loadMoreBtn.addEventListener('click', () => loadImages(false));
    refreshBtn.addEventListener('click', resetAndReload);
    statusFilter.addEventListener('change', resetAndReload);

    resetAndReload();
  </script>
</body>
</html>
